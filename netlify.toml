[build]
  publish = "."
  functions = "netlify/functions"

# Главната страница е курсът (16.11, по желание на Симона). Старата главна на
# салона е махната — тя е в историята на git, ако потрябва. /kurs/ остава
# на мястото си, за да работят вече пратените линкове и формата.
[[redirects]]
  from = "/"
  to = "/kurs/"
  status = 200
