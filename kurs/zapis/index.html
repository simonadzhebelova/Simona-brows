<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Запиши се за курс | Simona Brows</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="/kurs/fonts/fonts.css">
  <link rel="stylesheet" href="/kurs/kurs.css">
  <script src="/kurs/consent.js" defer></script>
</head>
<body>

<header class="top">
  <div class="top__in">
    <a class="top__logo" href="/" aria-label="Simona Brows, към главната страница">
      <img src="/brand_asset/f63e19c4-b78f-4928-bca8-ca702080b1ff-removebg-preview.png" alt="Simona Brows">
    </a>
    <a class="top__link" href="/kurs/">← Курсовете</a>
  </div>
</header>

<main class="form-page">
  <div class="wrap narrow">
    <h1>Запиши се за курс</h1>
    <p class="lede" style="margin-top:1rem">Попълни формата и ще ти се обадя, за да изберем курс и дата. Отнема по-малко от минута.</p>

    <!-- Формата е „kurs“ в Netlify Forms. Темата на имейла се попълва от
         скрипта долу с името, курса и кога да се обади, за да се вижда още
         в известието на телефона. data-remove-prefix маха „[Netlify]“. -->
    <form class="form-card" id="kursForm" name="kurs" method="POST" action="/kurs/blagodarya/"
          data-netlify="true" netlify-honeypot="bot-field">
      <input type="hidden" name="form-name" value="kurs">
      <input type="hidden" name="subject" data-remove-prefix value="Ново записване за курс">
      <p class="hp"><label>Не попълвай това: <input name="bot-field" tabindex="-1" autocomplete="off"></label></p>

      <label class="field">
        <span>Име</span>
        <input type="text" name="name" autocomplete="name" required>
      </label>

      <label class="field">
        <span>Телефон</span>
        <input type="tel" name="phone" autocomplete="tel" inputmode="tel" required placeholder="08…">
      </label>

      <fieldset class="field">
        <legend>Кой курс те интересува?</legend>
        <div class="choices">
          <label class="choice"><input type="radio" name="course" value="Пълен курс (3 дни, 700 €)" data-key="palen" required><span>Пълен курс<small>Ламиниране и епилация с конец, 3 дни, 700 €</small></span></label>
          <label class="choice"><input type="radio" name="course" value="Ламиниране на мигли и вежди (2 дни, 500 €)" data-key="laminirane"><span>Ламиниране на мигли и вежди<small>2 дни, 500 €</small></span></label>
          <label class="choice"><input type="radio" name="course" value="Епилация с конец, архитектура и колористика (2 дни, 350 €)" data-key="konec"><span>Епилация с конец, архитектура и колористика<small>2 дни, 350 €</small></span></label>
          <label class="choice"><input type="radio" name="course" value="Още не знам" data-key="neznam"><span>Още не знам<small>Ще ти помогна да избереш</small></span></label>
        </div>
      </fieldset>

      <fieldset class="field">
        <legend>Къде ти е удобно?</legend>
        <div class="choices choices--row">
          <label class="choice"><input type="radio" name="city" value="София" required><span>София</span></label>
          <label class="choice"><input type="radio" name="city" value="Сандански"><span>Сандански</span></label>
        </div>
      </fieldset>

      <fieldset class="field">
        <legend>Имаш ли опит?</legend>
        <div class="choices choices--row">
          <label class="choice"><input type="radio" name="experience" value="Започвам от нулата" required><span>Започвам от нулата</span></label>
          <label class="choice"><input type="radio" name="experience" value="Вече работя в бюти сферата"><span>Вече работя в бюти сферата</span></label>
        </div>
      </fieldset>

      <label class="field">
        <span>Въпрос или нещо, което те притеснява <span class="opt">(по желание)</span></span>
        <textarea name="question"></textarea>
      </label>

      <button class="btn btn--dark btn--wide" type="submit">Запиши ме</button>
      <p class="form-status" id="formStatus" role="status" hidden></p>
      <p class="form-note">Телефона ти използвам само за да ти се обадя за курса. Повече в <a href="/poveritelnost/">политиката за поверителност</a>.</p>
    </form>
  </div>
</main>

<footer class="foot foot--slim">
  <div class="wrap foot__in">
    <span>Simona Brows</span>
    <a href="/poveritelnost/">Поверителност</a>
    <button type="button" class="link-btn" data-cookie-settings hidden>Бисквитки</button>
  </div>
</footer>

<script>
  (function () {
    var form = document.getElementById('kursForm');
    var status = document.getElementById('formStatus');

    /* Бутонът „Запиши се“ при всеки курс води тук с ?kurs=…, за да е избран. */
    var key = new URLSearchParams(location.search).get('kurs');
    if (key) {
      var pre = form.querySelector('input[name="course"][data-key="' + key + '"]');
      if (pre) pre.checked = true;
    }

    function say(text, isError) {
      status.hidden = false;
      status.textContent = text;
      status.className = 'form-status' + (isError ? ' form-status--err' : '');
    }

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      if (!form.reportValidity()) return;

      var name = form.elements.name.value.trim();
      var course = form.elements.course.value;
      var city = form.elements.city.value;
      /* Темата на имейла: кой е, за кой курс и в кой град. */
      form.elements.subject.value = '🔔 Записване: ' + name + ', ' + course.replace(/ \(.*\)$/, '') + ', ' + city;

      var btn = form.querySelector('button[type=submit]');
      btn.disabled = true;
      say('Изпращам…');

      var body = new URLSearchParams(new FormData(form)).toString();
      fetch('/', { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: body })
        .then(function (r) {
          if (!r.ok) throw new Error(r.status);
          try { sessionStorage.setItem('kursName', name.split(' ')[0]); } catch (err) {}
          location.href = '/kurs/blagodarya/';
        })
        .catch(function () {
          btn.disabled = false;
          say('Формата не се изпрати. Опитай пак или ми звънни на 0893 006 402.', true);
        });
    });
  })();
</script>
</body>
</html>
